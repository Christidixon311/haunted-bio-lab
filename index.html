const BANK=[{"topic": "Macromolecules", "q": "A skeleton needs quick energy to escape the lab. Which nutrient is the best immediate fuel?", "a": ["Carbohydrates", "Nucleic acids", "Vitamins", "Water"], "c": 0, "e": "Cells can break down simple carbohydrates, such as glucose, to release usable energy."}, {"topic": "Macromolecules", "q": "Which pair correctly matches a macromolecule with its smaller building units?", "a": ["Protein \u2192 nucleotides", "Carbohydrate \u2192 amino acids", "Protein \u2192 amino acids", "Nucleic acid \u2192 fatty acids"], "c": 2, "e": "Proteins are chains of amino acids. Nucleic acids are made of nucleotides."}, {"topic": "Macromolecules", "q": "The lab stores a long-term energy reserve. Which group best fits this job?", "a": ["Proteins", "Lipids", "Nucleic acids", "Minerals"], "c": 1, "e": "Fats are lipids that store energy for later use. Lipids also help with insulation and membranes."}, {"topic": "Macromolecules", "q": "A monster inherits instructions for making its proteins. Where are those instructions stored?", "a": ["Starch", "Fat", "Cellulose", "DNA"], "c": 3, "e": "DNA is a nucleic acid that stores genetic information, including instructions used to make proteins."}, {"topic": "Macromolecules", "q": "Which list contains the four major groups of biological macromolecules?", "a": ["Water, salt, oxygen, carbon", "Carbohydrates, lipids, proteins, nucleic acids", "Glucose, starch, sugar, cellulose", "Vitamins, minerals, water, fats"], "c": 1, "e": "The four groups are carbohydrates, lipids, proteins, and nucleic acids. Water is essential but is not a macromolecule."}, {"topic": "Macromolecules", "q": "A witch strings amino acids together. What is she building?", "a": ["A protein", "A nucleic acid", "A simple sugar", "A fat"], "c": 0, "e": "Amino acids link into chains that fold into proteins. A protein\u2019s shape helps determine its job."}, {"topic": "Macromolecules", "q": "Which molecule is a carbohydrate that plants use to store energy?", "a": ["DNA", "An enzyme", "Starch", "An antibody"], "c": 2, "e": "Starch is a carbohydrate made from many glucose units. Plants use it for energy storage."}, {"topic": "Macromolecules", "q": "A ghost studies the cell membrane. Which type of lipid forms its main double layer?", "a": ["Glucose", "Phospholipids", "Amino acids", "Nucleotides"], "c": 1, "e": "Phospholipids form the membrane\u2019s bilayer. Their water-attracting heads face outward and their water-avoiding tails face inward."}, {"topic": "Macromolecules", "q": "What are the building units of DNA and RNA?", "a": ["Monosaccharides", "Fatty acids", "Amino acids", "Nucleotides"], "c": 3, "e": "Nucleotides are the repeating units of nucleic acids, including DNA and RNA."}, {"topic": "Macromolecules", "q": "Which example shows a structural role for a carbohydrate?", "a": ["Cellulose helps support plant cell walls", "DNA carries instructions", "Fat insulates an animal", "An enzyme speeds digestion"], "c": 0, "e": "Cellulose is a carbohydrate that provides support in plant cell walls. Carbohydrates do more than supply energy."}, {"topic": "Macromolecules", "q": "A snack contains oil, starch, and protein. Which ingredient belongs to the lipid group?", "a": ["Starch", "Oil", "Protein", "All three"], "c": 1, "e": "Oils and fats are lipids. Starch is a carbohydrate, and proteins are a separate group."}, {"topic": "Macromolecules", "q": "A lab label says \u201csimple sugar.\u201d Which term means one sugar unit?", "a": ["Nucleotide", "Amino acid", "Monosaccharide", "Polypeptide"], "c": 2, "e": "A monosaccharide is a single sugar unit, such as glucose. Many sugar units can join to form larger carbohydrates."}, {"topic": "Macromolecules", "q": "Which statement about food and macromolecules is most accurate?", "a": ["Every food contains only one type", "Proteins are found only in meat", "All fats are proteins", "One food can contain several types"], "c": 3, "e": "Foods are mixtures. Beans, for example, can provide both carbohydrates and proteins."}, {"topic": "Macromolecules", "q": "A lab breaks a large protein into its individual building units. What should it produce?", "a": ["Amino acids", "Nucleotides", "Glucose only", "Phospholipids"], "c": 0, "e": "Breaking the bonds in a protein chain releases smaller peptides and, with complete breakdown, amino acids."}, {"topic": "Macromolecules", "q": "Which statement correctly describes many fats?", "a": ["They are chains of nucleotides", "They contain glycerol joined to fatty acids", "They store genetic instructions", "They are always soluble in water"], "c": 1, "e": "A typical fat molecule has glycerol joined to three fatty acids. Lipids generally do not mix well with water."}, {"topic": "Enzymes", "q": "The haunted lab adds an enzyme to a reaction. What is the enzyme\u2019s main job?", "a": ["Become the final product", "Raise the energy needed to start", "Speed up the reaction", "Stop all molecular movement"], "c": 2, "e": "An enzyme is a biological catalyst. It speeds up a reaction by lowering the activation energy needed to start it."}, {"topic": "Enzymes", "q": "What is a substrate?", "a": ["The molecule an enzyme acts on", "A used-up enzyme", "Any cell membrane", "The heat released by a reaction"], "c": 0, "e": "A substrate is a reactant that binds to an enzyme and is changed during the reaction."}, {"topic": "Enzymes", "q": "Where does a substrate bind to an enzyme?", "a": ["The nucleus", "The cell wall", "A nucleotide", "The active site"], "c": 3, "e": "The active site is the part of an enzyme that binds the substrate and helps the reaction occur."}, {"topic": "Enzymes", "q": "Why can a starch-digesting enzyme fail to break down a protein?", "a": ["Proteins contain no chemical bonds", "Its active site is suited to a different substrate", "The enzyme has been used up", "All enzymes work on every molecule"], "c": 1, "e": "Enzymes are selective. The shape and chemical properties of an active site suit particular substrates."}, {"topic": "Enzymes", "q": "After an enzyme releases its products, what usually happens to the enzyme?", "a": ["It becomes DNA", "It is destroyed immediately", "It can catalyze another reaction", "It turns into a substrate"], "c": 2, "e": "An enzyme is not used up by the reaction it catalyzes. It can bind more substrate and work again."}, {"topic": "Enzymes", "q": "Most enzymes students study in biology belong to which macromolecule group?", "a": ["Proteins", "Lipids", "Carbohydrates", "Fats"], "c": 0, "e": "Most enzymes are proteins. Some RNA molecules also act as catalysts, so not every enzyme is a protein."}, {"topic": "Enzymes", "q": "A potion is heated far above an enzyme\u2019s ideal temperature. Its activity drops sharply. What is the best explanation?", "a": ["All substrate turned into enzyme", "The enzyme gained more active sites", "Its DNA evaporated", "The enzyme\u2019s shape changed"], "c": 3, "e": "High heat can denature an enzyme, changing its shape and active site so it no longer works well."}, {"topic": "Enzymes", "q": "An enzyme works best at pH 7. What is most likely if the solution becomes extremely acidic?", "a": ["The enzyme must work faster", "Its activity may decrease as its active site changes", "The enzyme becomes a carbohydrate", "Its temperature must increase"], "c": 1, "e": "Large pH changes can affect an enzyme\u2019s structure and its ability to bind substrate. Different enzymes have different optimal pH ranges."}, {"topic": "Enzymes", "q": "What does activation energy mean?", "a": ["Energy stored only in DNA", "The total mass of the products", "Energy needed to start a reaction", "The number of enzymes present"], "c": 2, "e": "Activation energy is the energy barrier that reactants must overcome. Enzymes lower that barrier."}, {"topic": "Enzymes", "q": "Which temperature produced the highest measured enzyme activity?", "a": ["10\u00b0C", "25\u00b0C", "40\u00b0C", "70\u00b0C"], "c": 2, "e": "The largest measured rate is 12 units/min at 40\u00b0C. These data identify the best tested temperature, not an exact optimum between measurements.", "data": [["Temperature", "Rate (units/min)"], ["10\u00b0C", "2"], ["25\u00b0C", "7"], ["40\u00b0C", "12"], ["70\u00b0C", "1"]]}, {"topic": "Enzymes", "q": "The lab cools an enzyme without freezing it. Its reaction slows. What is the best explanation?", "a": ["Molecules move more slowly and collide less often", "The enzyme must be permanently destroyed", "The substrate becomes DNA", "Cooling always changes protein into fat"], "c": 0, "e": "Cooling often slows enzyme reactions by slowing molecular motion. Slowing is not the same as permanent denaturation."}, {"topic": "Enzymes", "q": "All enzyme active sites are busy. More substrate is added, but the reaction rate hardly rises. Why?", "a": ["There is no longer any enzyme", "The enzyme has become a lipid", "The products are now enzymes", "The enzymes are working near their capacity"], "c": 3, "e": "When available enzymes are saturated with substrate, adding more substrate alone has little effect on the rate."}, {"topic": "Enzymes", "q": "A scientist tests how pH affects an enzyme. Which variable should she change on purpose?", "a": ["Both temperature and pH", "Only the pH", "Only the amount of enzyme", "Every condition at once"], "c": 1, "e": "Change pH while keeping other relevant conditions, such as temperature and enzyme amount, the same. This helps isolate the effect of pH."}, {"topic": "Enzymes", "q": "Which conclusion is supported by these results?", "a": ["The enzyme works equally well at every pH", "pH 3 destroys every enzyme", "This enzyme works best at pH 7 among the tested values", "All enzymes work best at pH 7"], "c": 2, "e": "The measured rate is highest at pH 7 for this enzyme. You cannot use one enzyme\u2019s results to describe all enzymes.", "data": [["pH", "Rate (units/min)"], ["3", "1"], ["7", "10"], ["11", "2"]]}, {"topic": "Enzymes", "q": "Which model best represents an enzyme-catalyzed reaction?", "a": ["Enzyme + substrate \u2192 enzyme + products", "Enzyme \u2192 substrate only", "Enzyme + substrate \u2192 no enzyme remains", "Substrate \u2192 enzyme + DNA"], "c": 0, "e": "The substrate becomes products, while the enzyme remains available to catalyze another reaction."}];

let session=null,state=null,poll=null,solo=null,lastRender='';
const art=`<div class="labart" aria-hidden="true"><svg viewBox="0 0 500 220" fill="none"><ellipse cx="260" cy="193" rx="201" ry="14" fill="#100e20"/><path d="M32 192H473" stroke="#60506f"/><path d="M89 42H131M96 43V105L66 167Q59 186 79 186H142Q162 186 154 167L124 105V43" stroke="#b7a1d5" stroke-width="3"/><path d="M89 132H133L151 172Q156 181 142 181H79Q68 181 72 171Z" fill="#a3b869"/><ellipse cx="111" cy="133" rx="22" ry="5" fill="#d3ed89"/><circle class="bubble" cx="100" cy="156" r="4" fill="#e5f4ba"/><circle class="bubble b2" cx="123" cy="169" r="3" fill="#e5f4ba"/><path d="M207 21H261M216 21V95Q177 112 176 147A63 43 0 0 0 302 147Q300 112 252 95V21" stroke="#b7a1d5" stroke-width="3"/><path d="M183 143Q211 128 239 143T295 143Q300 185 240 186Q180 184 183 143Z" fill="#bda4df"/><path d="M183 143Q211 128 239 143T295 143" stroke="#e5d2ff" stroke-width="3"/><circle class="bubble" cx="215" cy="161" r="6" fill="#dfccf6"/><circle class="bubble b2" cx="266" cy="153" r="4" fill="#dfccf6"/><circle class="bubble" cx="229" cy="106" r="5" stroke="#bca0df"/><circle class="bubble b2" cx="245" cy="76" r="3" stroke="#bca0df"/><path d="M225 10Q235 0 244 10" stroke="#ffa35d" stroke-width="2"/><path d="M342 88H366V157Q366 176 354 176Q342 176 342 157Z" stroke="#b7a1d5" stroke-width="3"/><path d="M346 119H362V156Q362 170 354 171Q346 170 346 156Z" fill="#ffa35d"/><path d="M384 88H408V157Q408 176 396 176Q384 176 384 157Z" stroke="#b7a1d5" stroke-width="3"/><path d="M388 134H404V156Q404 170 396 171Q388 170 388 156Z" fill="#d3ed89"/><path d="M330 110H420M332 110V186M418 110V186M326 187H426" stroke="#79618c" stroke-width="4"/><path d="M445 40Q451 28 463 39Q468 46 463 51L450 68L435 49Q432 40 440 38" fill="#e1d9e9"/><circle cx="446" cy="44" r="2" fill="#17152b"/><circle cx="457" cy="44" r="2" fill="#17152b"/><path d="M165 33L170 43L181 44L172 51L174 62L165 56L156 62L158 51L150 44L160 43Z" fill="#ffa35d"/><path d="M316 49h14m-7-7v14M52 96h10m-5-5v10" stroke="#d3ed89" stroke-width="2"/><path d="M75 202q9-17 22-5q10-21 24-4" stroke="#7c647d"/><text x="236" y="168" text-anchor="middle" fill="#30223f" font-size="15" font-family="Georgia">BIO</text></svg></div>`;

function home(){clearInterval(poll);session=null;state=null;solo=null;lastRender='';$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">Independent biology practice</div><h1>Something<br><em>smart</em> is brewing.</h1><p class="intro">Explore the haunted lab at your own pace. Practice macromolecules and enzymes, uncover the science, and build your biology confidence.</p><div class="labelrow"><span class="pill">🎃 Halloween challenge</span><span class="pill">📱 Play on your phone</span><span class="pill">✦ Self-paced practice</span></div>${art}</div><div class="joincard"><div class="eyebrow" style="color:#76638b;margin-bottom:22px">Your personal biology lab</div><h2>Ready to experiment?</h2><p class="cardintro">Choose your practice, then jump right in.</p><form id="practiceform"><label for="practiceTopic">WHAT WOULD YOU LIKE TO PRACTICE?</label><select id="practiceTopic"><option value="Mixed">Macromolecules & enzymes</option><option>Macromolecules</option><option>Enzymes</option></select><label for="practiceCount">HOW MANY QUESTIONS?</label><select id="practiceCount"><option value="10">10 questions · Quick practice</option><option value="15">15 questions · More practice</option><option value="30">All 30 questions · Full review</option></select><button class="btn dark wide" type="submit">Start practicing <span>→</span></button></form><p class="note">Play independently. No teacher, account, or code needed.<br>Untimed · Instant feedback · 100 points per correct answer<br>Standalone edition · Works offline in your browser</p></div></section><section class="steps" aria-label="How it works"><div class="step"><span class="stepnum">01</span><div><strong>Choose your experiment.</strong><p>Practice one topic or mix both together.</p></div></div><div class="step"><span class="stepnum">02</span><div><strong>Take your time.</strong><p>Read each question and choose your answer.</p></div></div><div class="step"><span class="stepnum">03</span><div><strong>Discover the science.</strong><p>Get an explanation immediately, then move on when ready.</p></div></div></section><section><div class="sectionline"><h2>INSIDE THE LAB</h2><span>30 original questions · Recall, application & data</span></div><div class="topics"><div class="topic"><i>🍬</i><div><strong>Carbohydrates</strong><small>Fuel & building blocks</small></div></div><div class="topic"><i>🧬</i><div><strong>Life’s molecules</strong><small>Proteins, lipids & DNA</small></div></div><div class="topic"><i>🗝</i><div><strong>Enzyme action</strong><small>Substrates & active sites</small></div></div><div class="topic"><i>🌡</i><div><strong>Lab conditions</strong><small>Temperature, pH & data</small></div></div></div></section>`;}

function table(q){return q.data?'<table class="datatable">'+q.data.map((r,i)=>'<tr>'+r.map(v=>`<${i?'td':'th'}>${esc(v)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>':''}

function reviewHTML(items,host=false){return items.map((q,i)=>`<details class="reviewitem"><summary>${!host?(q.own===q.c?'✓ ':q.own===null?'– ':'↻ '):''}${i+1}. ${esc(q.q)}</summary>${table(q)}${!host?`<p>Your answer: ${q.own===null?'Not answered':esc(q.a[q.own])}</p>`:`<p>${q.responses?.reduce((n,r)=>n+r.n,0)||0} responses · ${q.responses?.filter(r=>r.choice===q.c).reduce((n,r)=>n+r.n,0)||0} correct</p>`}<p class="right">Correct answer: ${esc(q.a[q.c])}</p><p>${esc(q.e)}</p></details>`).join('')}

function shuffleLocal(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSolo(topic='Mixed',count=10){clearInterval(poll);session=null;state=null;const eligible=BANK.map((_,i)=>i).filter(i=>topic==='Mixed'||BANK[i].topic===topic);let ids;if(topic==='Mixed'){const n=Math.min(count,eligible.length);ids=shuffleLocal([...shuffleLocal(eligible.filter(i=>BANK[i].topic==='Macromolecules')).slice(0,Math.ceil(n/2)),...shuffleLocal(eligible.filter(i=>BANK[i].topic==='Enzymes')).slice(0,Math.floor(n/2))]);}else ids=shuffleLocal(eligible).slice(0,count);solo={ids,topic,count,idx:0,answers:[],revealed:false};renderSolo()}
function renderSolo(){if(!solo)return;const n=solo.ids.length;const done=solo.idx===solo.ids.length;const items=solo.ids.map((id,i)=>({...BANK[id],own:solo.answers[i]??null}));const correct=items.filter(q=>q.own===q.c).length;if(done){$('#app').innerHTML=`<section class="stage"><div class="panel"><div class="eyebrow">Solo experiment complete</div><h1 style="font-size:49px">Knowledge is <em>magic.</em></h1><div class="statgrid"><div class="statbox"><b>${correct*100}</b><small>Points</small></div><div class="statbox"><b>${correct} / ${n}</b><small>Correct</small></div><div class="statbox"><b>${Math.round(correct/n*100)}%</b><small>Accuracy</small></div></div><div class="toolbar"><button class="btn" data-do="solo">Practice again</button><button class="btn outline" data-do="new">Back to the lab</button></div><h2 style="margin-top:30px">Your lab notebook</h2>${reviewHTML(items)}</div></section>`;return}const q=BANK[solo.ids[solo.idx]],own=solo.answers[solo.idx]??null;$('#app').innerHTML=`<section class="stage"><div class="stagehead"><span class="solo-banner">✦ SOLO PRACTICE · Untimed · ${n} questions</span><button class="btn small outline" data-do="new">Exit practice</button></div><div class="panel"><div class="toolbar spread"><span class="questionmeta">Question ${solo.idx+1} / ${n} · ${q.topic}</span><span class="score">${correct*100} points</span></div><h2 class="question">${esc(q.q)}</h2>${table(q)}<div class="answers">${q.a.map((a,i)=>`<button class="answer ${solo.revealed&&i===q.c?'correct':''} ${solo.revealed&&own===i&&i!==q.c?'wrong':''}" data-solo="${i}" ${solo.revealed?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span>${esc(a)}</button>`).join('')}</div>${solo.revealed?`<div class="explain"><strong>${own===q.c?'Correct! +100 points':'Keep experimenting!'}</strong>${esc(q.e)}</div><button class="btn orange" data-do="solonext">${solo.idx===n-1?'See my results':'Next question'} →</button>`:'<p class="sub">Choose an answer. An explanation appears after every question.</p>'}</div></section>`}

function modal(kind){let body='',title='';if(kind==='guide'){title='Welcome to the haunted lab';body=`<div class="help"><h3>1. Choose your practice</h3><p>Pick macromolecules, enzymes, or both, then choose your question count. Each topic contains 15 unique questions; mixed practice includes up to 30.</p><h3>2. Answer at your own pace</h3><p>Tap one answer to lock it in. There is no timer. Each correct answer earns 100 points, with no points deducted for mistakes.</p><h3>3. Learn after every question</h3><p>Your answer is checked immediately. Read the explanation, then press Next question when you are ready. No teacher or host is needed.</p><h3>4. Review your discoveries</h3><p>At the end, see your score and accuracy. Open any question in your lab notebook to review your answer and the explanation, or practice again with shuffled questions.</p><p>Open this HTML file in a modern browser to play offline, or place it on a web host to share a link. All questions, artwork, and game logic are included in this file. The optional science-reference links need internet access. Progress stays in this open tab; refreshing or closing it starts a new session.</p></div>`}else if(kind==='study'){title='Your biology field notes';body=`<p class="sub">A quick review before you enter the lab.</p><div class="studygrid"><div class="panel"><h3>🍬 Carbohydrates</h3><p>Simple sugars can provide quick fuel. Starch stores energy in plants; cellulose supports plant cell walls. One sugar unit is a monosaccharide.</p></div><div class="panel"><h3>🫒 Lipids</h3><p>Fats and oils store energy. Phospholipids form cell membranes. Typical fats contain glycerol and fatty acids. Lipids generally do not mix with water.</p></div><div class="panel"><h3>🧩 Proteins</h3><p>Made of amino acids. They help with structure, transport, defense, and reactions. A protein’s shape matters for its function.</p></div><div class="panel"><h3>🧬 Nucleic acids</h3><p>DNA and RNA are made of nucleotides. DNA stores genetic instructions; RNA helps cells use those instructions.</p></div></div><div class="explain"><strong>🗝 Enzymes: shape, speed, and conditions</strong>Most enzymes are proteins. They lower activation energy, bind particular substrates at an active site, and can be reused. Temperature and pH affect activity; extreme conditions can change the enzyme’s shape. Cold often slows activity without permanently damaging the enzyme.</div><p class="sub">Original questions for grade 8 practice. Science references: <a href="https://openstax.org/books/biology-2e/pages/3-1-synthesis-of-biological-macromolecules" target="_blank" rel="noopener">OpenStax: macromolecules ↗</a> · <a href="https://www.khanacademy.org/science/biology/proteins-and-enzymes/introduction-to-enzymes/a/enzymes-and-the-active-site" target="_blank" rel="noopener">Khan Academy: enzymes ↗</a></p><button class="btn outline" style="margin-top:22px" data-do="bank">View all 30 practice questions</button>`}else{title='Question bank · 30 questions';body='<p class="sub">15 macromolecule questions and 15 enzyme questions. Select a question to see the answer.</p>'+reviewHTML(BANK.map(q=>({...q,own:null}))).replaceAll('Your answer: Not answered','Practice question')}
$('#modal').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="textbtn" data-do="closemodal" aria-label="Close dialog">×</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;}

document.addEventListener('submit',e=>{if(e.target.id==='practiceform'){e.preventDefault();startSolo($('#practiceTopic').value,+$('#practiceCount').value);window.scrollTo(0,0)}});
document.addEventListener('change',e=>{if(e.target.id==='practiceTopic'){$('#practiceCount').innerHTML='<option value="10">10 questions · Quick practice</option><option value="15">15 questions · More practice</option>'+(e.target.value==='Mixed'?'<option value="30">All 30 questions · Full review</option>':'')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.solo!==undefined){if(solo&&!solo.revealed){solo.answers[solo.idx]=+b.dataset.solo;solo.revealed=true;renderSolo()}return}const action=b.dataset.do;if(['guide','study','bank'].includes(action))modal(action);else if(action==='closemodal')$('#modal').close();else if(['home','new'].includes(action)){home();window.scrollTo(0,0)}else if(action==='solo'){startSolo(solo?.topic||'Mixed',solo?.count||10);window.scrollTo(0,0)}else if(action==='solonext'&&solo){solo.idx++;solo.revealed=false;renderSolo();window.scrollTo(0,0)}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});
home();
</script></body></html>
